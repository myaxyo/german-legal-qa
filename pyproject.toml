[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "german-legal-qa"
version = "0.1.0"
description = "German Legal QA Assistant – fine-tuned LLM + RAG for German law"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{ name = "Jon" }]

dependencies = [
    # Core
    "torch>=2.2.0",
    "transformers>=4.44.0",
    "datasets>=2.20.0",
    "accelerate>=0.33.0",
    "peft>=0.12.0",
    "bitsandbytes>=0.43.0",
    "trl>=0.9.0",
    # RAG
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-huggingface>=0.0.3",
    # Data processing
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "zstandard>=0.22.0",
    # Evaluation
    "rouge-score>=0.1.2",
    "sacrebleu>=2.4.0",
    "bert-score>=0.3.13",
    # Demo
    "gradio>=4.40.0",
    # Utilities
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
    "mlx>=0.32.0",
    "mlx-lm>=0.31.3",
]

[project.optional-dependencies]
mlx = [
    "mlx>=0.16.0",
    "mlx-lm>=0.18.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "ipykernel>=6.29.0",
]

[project.scripts]
glqa = "glqa.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/glqa"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
